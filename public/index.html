<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgriSphere AI</title>
  <meta name="description" content="AI-powered agricultural intermediary: crop & seed advice, soil intelligence, schemes, market, storage and plant-health screening." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #FBFAF6; overflow: hidden; }
    #loader { position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; background: linear-gradient(120deg, #0F3D2E, #1B5E3A 55%, #2E7D4F); color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
    #loader h1 { margin: 0; font-size: 2rem; letter-spacing: -.02em; }
    #loader p { margin: 0; opacity: .85; max-width: 420px; line-height: 1.5; }
    .spin { width: 38px; height: 38px; border: 4px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%;
      animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div style="font-size:3rem">🌾</div>
    <h1>AgriSphere AI</h1>
    <div class="spin"></div>
    <p id="msg">Booting browser-based Python environment... First visit takes 20–40 seconds; subsequent visits load instantly.</p>
  </div>
  <div id="root"></div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

    mount(
      {
        entrypoint: "app.py",
        requirements: ["numpy", "pandas", "pillow"],
        files: { "app.py": { url: "./app.py" } },
      },
      document.getElementById("root")
    );

    // Keep the custom loader active until the actual Streamlit app container renders its main content
    const started = Date.now();
    const timer = setInterval(() => {
      const stApp = document.querySelector('.stApp') || document.querySelector('[data-testid="stApp"]');
      if (stApp && stApp.innerText.trim().length > 0) {
        document.getElementById("loader")?.remove();
        document.body.style.overflow = "auto";
        clearInterval(timer);
      } else if (Date.now() - started > 90000) {
        document.getElementById("msg").textContent =
          "This is taking longer than usual. Check your internet connection and refresh the page.";
      }
    }, 400);
  </script>
</body>
</html>
